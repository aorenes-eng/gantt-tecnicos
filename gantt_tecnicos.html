<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planificación Técnicos – Obra Nueva</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f5f4f0;--surface:#fff;--border:#e2e0da;--border2:#cccab8;--text:#1a1917;--muted:#7a7870;--faint:#b8b6ad;--we-bg:#f0ede8;--today-bg:#fff8e6;--row-alt:#faf9f7;--shadow:0 1px 3px rgba(0,0,0,.07);--libre:#2a9d5c;--libre-bg:#eaf6f0;--overlap:#c94040;--overlap-bg:#fff0f0}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

  /* HEADER */
  .page-header{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
  .page-title{font-size:14px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  .dot{width:7px;height:7px;border-radius:50%;background:#2a9d5c;flex-shrink:0}
  .dot.loading{background:#e8c840;animation:pulse 1s infinite}
  .dot.error{background:#c94040}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .header-controls{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .btn{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;padding:5px 11px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap}
  .btn:hover{background:var(--bg);border-color:var(--text)}
  .btn.active{background:var(--text);color:#fff;border-color:var(--text)}
  .btn-today{background:#f0faf5;border-color:#a8dbbe;color:#1a6b42;font-weight:600}
  .btn-today:hover{background:#ddf2ea}
  .btn-refresh{display:flex;align-items:center;gap:4px;background:#f5f4f0;border-color:#ccc}
  .btn-refresh svg{width:12px;height:12px}
  .nav-group{display:flex;align-items:center;gap:3px}
  .nav-label{font-size:11px;font-weight:500;color:var(--muted);min-width:150px;text-align:center;font-family:'IBM Plex Mono',monospace}

  /* MAIN */
  .main{padding:16px 24px 40px;display:flex;gap:16px;align-items:flex-start}
  .sidebar{width:200px;flex-shrink:0}
  .gantt-area{flex:1;min-width:0}

  /* SIDEBAR */
  .sidebar-section{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:12px}
  .sidebar-title{font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:10px 12px 6px;border-bottom:1px solid var(--border)}
  .tec-btn{width:100%;text-align:left;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;padding:7px 12px;border:none;background:transparent;color:var(--text);cursor:pointer;border-bottom:1px solid var(--border);transition:background .1s;display:flex;align-items:center;justify-content:space-between;gap:6px}
  .tec-btn:last-child{border-bottom:none}
  .tec-btn:hover{background:var(--bg)}
  .tec-btn.active{background:var(--text);color:#fff}
  .tec-btn.libre-hoy .tec-name::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--libre);margin-left:6px;flex-shrink:0}
  .tec-btn.active.libre-hoy .tec-name::after{background:#a8dbbe}
  .tec-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* LIBRES ALERT */
  .libres-alert{background:var(--libre-bg);border:1px solid #a8dbbe;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:#1a5a30}
  .libres-alert strong{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--libre);margin-bottom:5px}
  .libres-alert ul{list-style:none;padding:0}
  .libres-alert li{padding:2px 0;display:flex;align-items:center;gap:5px}
  .libres-alert li::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--libre);flex-shrink:0}

  /* OVERLAP ALERT */
  .overlap-alert{background:var(--overlap-bg);border:1px solid #f5c0c0;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12px;color:#7a1a1a;display:none}
  .overlap-alert strong{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--overlap);margin-bottom:5px}
  .overlap-alert ul{list-style:none;padding:0}
  .overlap-alert li{padding:2px 0}

  .status-bar{font-size:11px;color:var(--muted);margin-bottom:12px;font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tag{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2px 7px;font-size:11px}

  /* GANTT */
  .gantt-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
  .gantt-scroll{overflow-x:auto}
  .gantt{min-width:600px}
  .g-header{display:flex;border-bottom:1.5px solid var(--border2);background:#f8f7f4}
  .g-name-col{min-width:150px;width:150px;flex-shrink:0;font-size:10px;font-weight:600;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;padding:10px 12px;border-right:1px solid var(--border2);display:flex;align-items:flex-end}
  .g-weeks{flex:1;display:flex;flex-direction:column}
  .g-week-labels{display:flex;border-bottom:1px solid var(--border)}
  .g-week-lbl{font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;padding:5px 8px;border-right:1px solid var(--border);white-space:nowrap}
  .g-week-lbl:last-child{border-right:none}
  .g-day-labels{display:flex}
  .g-day{flex:1;font-size:10px;color:var(--faint);text-align:center;padding:4px 1px 6px;border-right:1px solid var(--border);min-width:26px}
  .g-day:last-child{border-right:none}
  .g-day .dn{font-size:9px;display:block;color:var(--faint);margin-bottom:1px}
  .g-day .dd{font-size:11px;font-weight:500;color:var(--muted)}
  .g-day.weekend{background:var(--we-bg)}
  .g-day.today{background:var(--today-bg)}
  .g-day.today .dd{color:#b88000;font-weight:600}
  .g-row{display:flex;border-bottom:1px solid var(--border);min-height:40px;align-items:stretch;transition:opacity .2s}
  .g-row:last-child{border-bottom:none}
  .g-row:nth-child(even) .g-name,.g-row:nth-child(even) .g-track{background:var(--row-alt)}
  .g-row:hover .g-name,.g-row:hover .g-track{background:#f0ede8}
  .g-row.dimmed{opacity:.25}
  .g-name{min-width:150px;width:150px;flex-shrink:0;font-size:12px;font-weight:500;color:var(--text);padding:0 12px;display:flex;align-items:center;border-right:1px solid var(--border2);transition:background .1s;cursor:pointer;gap:6px}
  .g-name:hover{background:#f0ede8 !important}
  .g-name .libre-dot{width:5px;height:5px;border-radius:50%;background:var(--libre);flex-shrink:0}
  .g-track{flex:1;display:flex;position:relative;align-items:center;transition:background .1s}
  .g-cell{flex:1;border-right:1px solid var(--border);height:100%;min-width:26px}
  .g-cell:last-child{border-right:none}
  .g-cell.weekend{background:var(--we-bg)}
  .g-cell.today{background:var(--today-bg)}

  /* BARS */
  .g-bar{position:absolute;top:4px;bottom:4px;border-radius:5px;display:flex;align-items:center;padding:0 8px;overflow:visible;cursor:default}
  .g-bar-label{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .g-bar.overlap{background:var(--overlap-bg) !important;border:1.5px solid var(--overlap) !important}
  .g-bar.overlap .g-bar-label{color:var(--overlap) !important}
  .libre-bar{border:1.5px dashed #a8dbbe !important;background:transparent !important}
  .libre-bar .g-bar-label{color:var(--libre) !important}

  /* TOOLTIP */
  .g-tooltip{display:none;position:fixed;background:var(--text);color:#fff;font-size:12px;padding:8px 12px;border-radius:7px;white-space:nowrap;z-index:9999;pointer-events:none;line-height:1.6;box-shadow:0 4px 12px rgba(0,0,0,.2)}
  .g-tooltip .tt-title{font-weight:600;margin-bottom:2px}
  .g-tooltip .tt-dates{font-family:'IBM Plex Mono',monospace;font-size:11px;opacity:.8}
  .g-tooltip .tt-duration{font-size:11px;opacity:.7;margin-top:1px}
  .g-tooltip .tt-overlap{color:#ff9999;font-size:11px;margin-top:3px}

  .legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:3px 9px}
  .leg-dot{width:8px;height:8px;border-radius:3px;flex-shrink:0}

  .error-box{background:#fff5f5;border:1px solid #f5c0c0;border-radius:8px;padding:12px 16px;font-size:13px;color:#a03030;margin-bottom:12px;font-family:'IBM Plex Mono',monospace;white-space:pre-wrap;line-height:1.6}
  .state-msg{text-align:center;padding:50px 20px;font-size:14px;color:var(--muted)}
  .state-msg .icon{font-size:26px;margin-bottom:10px}

  @media(max-width:700px){
    .main{flex-direction:column}
    .sidebar{width:100%}
  }
</style>
</head>
<body>

<div class="page-header">
  <div class="page-title">
    <span class="dot" id="status-dot"></span>
    Planificación técnicos — Obra Nueva
  </div>
  <div class="header-controls">
    <button class="btn btn-today" onclick="goToday()">Hoy</button>
    <div class="nav-group">
      <button class="btn" onclick="shiftWeeks(-1)">&#8592;</button>
      <span class="nav-label" id="nav-label">—</span>
      <button class="btn" onclick="shiftWeeks(1)">&#8594;</button>
    </div>
    <button class="btn" id="w2" onclick="setWeeks(2)">2 sem</button>
    <button class="btn active" id="w3" onclick="setWeeks(3)">3 sem</button>
    <button class="btn" id="w4" onclick="setWeeks(4)">4 sem</button>
    <button class="btn btn-refresh" onclick="loadData()" id="refresh-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.59"/></svg>
      Actualizar
    </button>
  </div>
</div>

<div id="tooltip" class="g-tooltip"></div>

<div class="main">
  <div class="sidebar">
    <div id="libres-alert" class="libres-alert" style="display:none">
      <strong>Libres esta semana</strong>
      <ul id="libres-list"></ul>
    </div>
    <div id="overlap-alert" class="overlap-alert">
      <strong>Solapamientos</strong>
      <ul id="overlap-list"></ul>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-title">Técnicos</div>
      <div id="tec-list"></div>
    </div>
  </div>

  <div class="gantt-area">
    <div id="error-box" class="error-box" style="display:none"></div>
    <div class="status-bar"><span id="status-text">Cargando datos...</span></div>
    <div class="gantt-card">
      <div class="gantt-scroll">
        <div class="gantt" id="gantt">
          <div class="state-msg"><div class="icon">⏳</div>Cargando datos desde Google Sheets...</div>
        </div>
      </div>
    </div>
    <div class="legend" id="legend"></div>
  </div>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx_ihIj0no5v6ctW2CEcV18Sb52G66_IAYgMYlgopJoSziRROg1mYd9q7nzJzaeR329/exec';

const PALETTE=[['#c8dff5','#1a4a7a'],['#b8ead8','#0d5c3a'],['#f5d4b8','#7a3810'],['#f0c8d8','#7a1a40'],['#f5e8b0','#7a5800'],['#d8d0f0','#3a2880'],['#f0c8c8','#7a1a1a'],['#c8e8d0','#1a5a30'],['#e8d8c0','#5a3a10'],['#d0e0f0','#1a3a6a'],['#f0e0c8','#6a3a10'],['#d8f0d8','#1a5a1a']];
let colorMap={},colorIdx=0;
function getColor(obra){
  if(obra.toLowerCase()==='libre')return null;
  if(!colorMap[obra]){colorMap[obra]=PALETTE[colorIdx%PALETTE.length];colorIdx++;}
  return colorMap[obra];
}

const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
const MESES=['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
let entries=[],viewStart=null,viewWeeks=3,selectedTec=null;

function parseDate(s){
  if(!s)return null;
  s=String(s).trim();
  const p=s.split(/[\/\-\.]/);
  if(p.length<3)return null;
  let d,m,y;
  if(String(p[2]).length===4){[d,m,y]=p.map(Number);}else{[y,m,d]=p.map(Number);}
  if(!d||!m||!y)return null;
  const dt=new Date(y,m-1,d);dt.setHours(0,0,0,0);return dt;
}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function sameDay(a,b){return a.toDateString()===b.toDateString();}
function daysBetween(a,b){return Math.round((b-a)/864e5);}
function getMonday(d){const r=new Date(d);r.setHours(0,0,0,0);const wd=r.getDay();r.setDate(r.getDate()+(wd===0?-6:1-wd));return r;}
function fmt(dt){return `${dt.getDate()}/${dt.getMonth()+1}/${dt.getFullYear()}`;}

function shiftWeeks(n){viewStart=addDays(viewStart,n*7);render();}
function goToday(){viewStart=getMonday(new Date());render();}
function setWeeks(n){viewWeeks=n;['w2','w3','w4'].forEach(id=>{document.getElementById(id).classList.toggle('active',parseInt(id[1])===n);});render();}

// Detect overlaps: técnico has 2+ obras on same day
function getOverlaps(){
  const overlaps=[];
  const tecNames=[...new Set(entries.map(e=>e.tecnico))];
  tecNames.forEach(tec=>{
    const tecE=entries.filter(e=>e.tecnico===tec&&e.obra.toLowerCase()!=='libre');
    // Check each pair
    for(let i=0;i<tecE.length;i++){
      for(let j=i+1;j<tecE.length;j++){
        const a=tecE[i],b=tecE[j];
        const overlapStart=a.start>b.start?a.start:b.start;
        const overlapEnd=a.end<b.end?a.end:b.end;
        if(overlapStart<=overlapEnd){
          overlaps.push({tecnico:tec,obra1:a.obra,obra2:b.obra,start:overlapStart,end:overlapEnd});
        }
      }
    }
  });
  return overlaps;
}

// Check if tecnico is libre this week
function getTecLibreThisWeek(){
  const today=new Date();today.setHours(0,0,0,0);
  const weekStart=getMonday(today);
  const weekEnd=addDays(weekStart,6);
  const tecNames=[...new Set(entries.map(e=>e.tecnico))];
  return tecNames.filter(tec=>{
    return entries.some(e=>
      e.tecnico===tec&&
      e.obra.toLowerCase()==='libre'&&
      e.start<=weekEnd&&e.end>=weekStart
    );
  });
}

function loadData(){
  const dot=document.getElementById('status-dot');
  const txt=document.getElementById('status-text');
  const eb=document.getElementById('error-box');
  const rfb=document.getElementById('refresh-btn');
  dot.className='dot loading';txt.textContent='Actualizando...';rfb.disabled=true;eb.style.display='none';

  const cbName='cb_'+Date.now();
  const script=document.createElement('script');
  const timer=setTimeout(()=>{
    script.remove();delete window[cbName];
    showError('Tiempo de espera agotado.');rfb.disabled=false;
  },15000);

  window[cbName]=function(data){
    clearTimeout(timer);script.remove();delete window[cbName];
    try{
      if(!Array.isArray(data)||!data.length)throw new Error('No hay datos en la hoja.');
      colorMap={};colorIdx=0;entries=[];
      data.forEach(row=>{
        const start=parseDate(row.inicio);
        const end=parseDate(row.fin);
        if(!row.tecnico||!row.obra||!start||!end)return;
        entries.push({tecnico:row.tecnico,obra:row.obra,start,end});
      });
      if(!entries.length)throw new Error('No se encontraron filas válidas.');
      dot.className='dot';
      const now=new Date();
      txt.innerHTML=`<span class="tag">${entries.length} asignaciones</span> <span class="tag">${new Set(entries.map(e=>e.tecnico)).size} técnicos</span> <span class="tag">${new Set(entries.map(e=>e.obra)).size} obras</span> · ${now.toLocaleTimeString('es-ES')}`;
      selectedTec=null;
      render();
    }catch(err){showError(err.message);}
    rfb.disabled=false;
  };

  function showError(msg){
    dot.className='dot error';
    document.getElementById('status-text').textContent='Error al cargar';
    eb.style.display='block';eb.textContent='⚠ '+msg;
  }

  script.src=APPS_SCRIPT_URL+'?callback='+cbName;
  script.onerror=()=>{clearTimeout(timer);script.remove();delete window[cbName];showError('No se pudo conectar con Google Apps Script.');rfb.disabled=false;};
  document.head.appendChild(script);
}

function selectTec(name){
  selectedTec = selectedTec===name ? null : name;
  render();
}

function render(){
  if(!entries.length)return;
  const today=new Date();today.setHours(0,0,0,0);
  if(!viewStart)viewStart=getMonday(today);

  const days=[];
  for(let i=0;i<viewWeeks*7;i++)days.push(addDays(viewStart,i));
  const rangeStart=days[0],rangeEnd=days[days.length-1];

  const m1=MESES[rangeStart.getMonth()+1],m2=MESES[rangeEnd.getMonth()+1];
  document.getElementById('nav-label').textContent=m1===m2
    ?`${rangeStart.getDate()} – ${rangeEnd.getDate()} ${m1} ${rangeEnd.getFullYear()}`
    :`${rangeStart.getDate()} ${m1} – ${rangeEnd.getDate()} ${m2} ${rangeEnd.getFullYear()}`;

  const tecOrder=[...new Set(entries.map(e=>e.tecnico))];
  const libresThisWeek=getTecLibreThisWeek();
  const overlaps=getOverlaps();

  // Libres alert
  const libresAlert=document.getElementById('libres-alert');
  const libresList=document.getElementById('libres-list');
  if(libresThisWeek.length){
    libresAlert.style.display='block';
    libresList.innerHTML=libresThisWeek.map(t=>`<li>${t}</li>`).join('');
  } else {
    libresAlert.style.display='none';
  }

  // Overlaps alert
  const overlapAlert=document.getElementById('overlap-alert');
  const overlapList=document.getElementById('overlap-list');
  if(overlaps.length){
    overlapAlert.style.display='block';
    overlapList.innerHTML=overlaps.map(o=>`<li>${o.tecnico}: ${o.obra1} / ${o.obra2}</li>`).join('');
  } else {
    overlapAlert.style.display='none';
  }

  // Sidebar tecnico list
  const tecList=document.getElementById('tec-list');
  tecList.innerHTML='';
  tecOrder.forEach(tec=>{
    const btn=document.createElement('button');
    btn.className='tec-btn'+(selectedTec===tec?' active':'')+(libresThisWeek.includes(tec)?' libre-hoy':'');
    btn.innerHTML=`<span class="tec-name">${tec}</span>`;
    btn.onclick=()=>selectTec(tec);
    tecList.appendChild(btn);
  });

  const cellW=100/days.length;
  const gantt=document.getElementById('gantt');
  gantt.innerHTML='';

  // Header
  const hdr=document.createElement('div');hdr.className='g-header';
  const nc=document.createElement('div');nc.className='g-name-col';nc.textContent='Técnico';hdr.appendChild(nc);
  const wks=document.createElement('div');wks.className='g-weeks';
  const wkRow=document.createElement('div');wkRow.className='g-week-labels';
  for(let w=0;w<viewWeeks;w++){
    const ws=days[w*7];
    const lbl=document.createElement('div');lbl.className='g-week-lbl';
    lbl.style.flex=String(Math.min(7,days.length-w*7));
    lbl.textContent=`Sem ${w+1} · ${ws.getDate()} ${MESES[ws.getMonth()+1]}`;
    wkRow.appendChild(lbl);
  }
  wks.appendChild(wkRow);
  const dayRow=document.createElement('div');dayRow.className='g-day-labels';
  days.forEach(d=>{
    const wd=d.getDay();
    const cls=['g-day',(wd===0||wd===6)?'weekend':'',sameDay(d,today)?'today':''].filter(Boolean).join(' ');
    const div=document.createElement('div');div.className=cls;
    div.innerHTML=`<span class="dn">${DIAS[wd]}</span><span class="dd">${d.getDate()}</span>`;
    dayRow.appendChild(div);
  });
  wks.appendChild(dayRow);hdr.appendChild(wks);gantt.appendChild(hdr);

  // Rows
  const obrasVistas=new Set();
  tecOrder.forEach(tec=>{
    const tecE=entries.filter(e=>e.tecnico===tec);
    const isLibreThisWeek=libresThisWeek.includes(tec);
    const isDimmed=selectedTec&&selectedTec!==tec;

    const row=document.createElement('div');
    row.className='g-row'+(isDimmed?' dimmed':'');

    const nameDiv=document.createElement('div');
    nameDiv.className='g-name';
    nameDiv.onclick=()=>selectTec(tec);
    nameDiv.title='Clic para filtrar';
    if(isLibreThisWeek){
      nameDiv.innerHTML=`${tec}<span class="libre-dot"></span>`;
    } else {
      nameDiv.textContent=tec;
    }
    row.appendChild(nameDiv);

    const track=document.createElement('div');track.className='g-track';
    days.forEach(d=>{
      const wd=d.getDay();
      const cell=document.createElement('div');
      cell.className=['g-cell',(wd===0||wd===6)?'weekend':'',sameDay(d,today)?'today':''].filter(Boolean).join(' ');
      track.appendChild(cell);
    });

    // Check which entries overlap for this tec
    const tecOverlapEntries=new Set();
    overlaps.filter(o=>o.tecnico===tec).forEach(o=>{
      tecE.forEach(e=>{
        if(e.obra===o.obra1||e.obra===o.obra2) tecOverlapEntries.add(e);
      });
    });

    tecE.forEach(e=>{
      const bs=e.start<rangeStart?rangeStart:e.start;
      const be=e.end>rangeEnd?rangeEnd:e.end;
      if(be<rangeStart||bs>rangeEnd)return;
      const off=daysBetween(rangeStart,bs);
      const span=daysBetween(bs,be)+1;
      if(span<=0)return;
      const isLibre=e.obra.toLowerCase()==='libre';
      const isOverlap=tecOverlapEntries.has(e);
      const color=getColor(e.obra);
      obrasVistas.add(e.obra);

      const bar=document.createElement('div');
      bar.className='g-bar'+(isLibre?' libre-bar':'')+(isOverlap&&!isLibre?' overlap':'');
      bar.style.left=(off*cellW)+'%';
      bar.style.width=(span*cellW)+'%';
      if(!isLibre&&!isOverlap&&color)bar.style.background=color[0];

      const label=document.createElement('span');label.className='g-bar-label';
      if(isOverlap&&!isLibre){label.style.color='var(--overlap)';}
      else if(isLibre){label.style.color='var(--libre)';}
      else if(color){label.style.color=color[1];}
      label.textContent=e.obra;bar.appendChild(label);

      // Rich tooltip
      const durDays=daysBetween(e.start,e.end)+1;
      bar.addEventListener('mouseenter',ev=>{
        const tt=document.getElementById('tooltip');
        let html=`<div class="tt-title">${tec} · ${e.obra}</div>`;
        html+=`<div class="tt-dates">${fmt(e.start)} → ${fmt(e.end)}</div>`;
        html+=`<div class="tt-duration">${durDays} día${durDays!==1?'s':''}</div>`;
        if(isOverlap&&!isLibre) html+=`<div class="tt-overlap">⚠ Solapamiento detectado</div>`;
        tt.innerHTML=html;
        tt.style.display='block';
        positionTooltip(ev);
      });
      bar.addEventListener('mousemove',positionTooltip);
      bar.addEventListener('mouseleave',()=>{document.getElementById('tooltip').style.display='none';});

      track.appendChild(bar);
    });

    row.appendChild(track);
    gantt.appendChild(row);
  });

  // Legend
  const legend=document.getElementById('legend');legend.innerHTML='';
  [...obrasVistas].forEach(obra=>{
    const item=document.createElement('div');item.className='leg';
    if(obra.toLowerCase()==='libre'){
      item.innerHTML=`<span class="leg-dot" style="background:transparent;border:1.5px dashed var(--libre)"></span>${obra}`;
    }else{
      const c=getColor(obra);if(!c)return;
      item.innerHTML=`<span class="leg-dot" style="background:${c[0]};border:1px solid ${c[1]}40"></span>${obra}`;
    }
    legend.appendChild(item);
  });
}

function positionTooltip(ev){
  const tt=document.getElementById('tooltip');
  const x=ev.clientX+14,y=ev.clientY-10;
  const w=tt.offsetWidth,h=tt.offsetHeight;
  tt.style.left=(x+w>window.innerWidth?x-w-20:x)+'px';
  tt.style.top=(y+h>window.innerHeight?y-h:y)+'px';
}

viewStart=getMonday(new Date());
loadData();
</script>
</body>
