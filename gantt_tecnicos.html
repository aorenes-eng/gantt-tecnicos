<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planificación Técnicos – Obra Nueva</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f5f4f0;--surface:#fff;--border:#e2e0da;--border2:#cccab8;--text:#1a1917;--muted:#7a7870;--faint:#b8b6ad;--we-bg:#f0ede8;--today-bg:#fff8e6;--row-alt:#faf9f7;--shadow:0 1px 3px rgba(0,0,0,.07)}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .page-header{background:var(--surface);border-bottom:1px solid var(--border);padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
  .page-title{font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
  .dot{width:8px;height:8px;border-radius:50%;background:#2a9d5c;flex-shrink:0}
  .dot.loading{background:#e8c840;animation:pulse 1s infinite}
  .dot.error{background:#c94040}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .header-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .btn{font-family:'Inter',sans-serif;font-size:12px;font-weight:500;padding:6px 12px;border:1px solid var(--border2);border-radius:6px;background:var(--surface);color:var(--text);cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap}
  .btn:hover{background:var(--bg);border-color:var(--text)}
  .btn.active{background:var(--text);color:#fff;border-color:var(--text)}
  .btn-refresh{display:flex;align-items:center;gap:5px;background:#f0faf5;border-color:#a8dbbe;color:#1a6b42}
  .btn-refresh:hover{background:#ddf2ea}
  .btn-refresh svg{width:13px;height:13px}
  .nav-group{display:flex;align-items:center;gap:4px}
  .nav-label{font-size:12px;font-weight:500;color:var(--muted);min-width:160px;text-align:center;font-family:'IBM Plex Mono',monospace}
  .main{padding:20px 28px 40px}
  .status-bar{font-size:12px;color:var(--muted);margin-bottom:14px;font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tag{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:3px 8px;font-size:11px}
  .gantt-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
  .gantt-scroll{overflow-x:auto}
  .gantt{min-width:700px}
  .g-header{display:flex;border-bottom:1.5px solid var(--border2);background:#f8f7f4;position:sticky;top:0;z-index:10}
  .g-name-col{min-width:160px;width:160px;flex-shrink:0;font-size:10px;font-weight:600;letter-spacing:.07em;color:var(--muted);text-transform:uppercase;padding:10px 14px;border-right:1px solid var(--border2);display:flex;align-items:flex-end}
  .g-weeks{flex:1;display:flex;flex-direction:column}
  .g-week-labels{display:flex;border-bottom:1px solid var(--border)}
  .g-week-lbl{font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;padding:6px 10px;border-right:1px solid var(--border);white-space:nowrap}
  .g-week-lbl:last-child{border-right:none}
  .g-day-labels{display:flex}
  .g-day{flex:1;font-size:10px;color:var(--faint);text-align:center;padding:5px 2px 7px;border-right:1px solid var(--border);min-width:28px}
  .g-day:last-child{border-right:none}
  .g-day .dn{font-size:9px;display:block;color:var(--faint);margin-bottom:1px}
  .g-day .dd{font-size:12px;font-weight:500;color:var(--muted)}
  .g-day.weekend{background:var(--we-bg)}
  .g-day.today{background:var(--today-bg)}
  .g-day.today .dd{color:#b88000;font-weight:600}
  .g-row{display:flex;border-bottom:1px solid var(--border);min-height:42px;align-items:stretch}
  .g-row:last-child{border-bottom:none}
  .g-row:nth-child(even) .g-name,.g-row:nth-child(even) .g-track{background:var(--row-alt)}
  .g-row:hover .g-name,.g-row:hover .g-track{background:#f0ede8}
  .g-name{min-width:160px;width:160px;flex-shrink:0;font-size:12px;font-weight:500;color:var(--text);padding:0 14px;display:flex;align-items:center;border-right:1px solid var(--border2);transition:background .1s}
  .g-track{flex:1;display:flex;position:relative;align-items:center;transition:background .1s}
  .g-cell{flex:1;border-right:1px solid var(--border);height:100%;min-width:28px}
  .g-cell:last-child{border-right:none}
  .g-cell.weekend{background:var(--we-bg)}
  .g-cell.today{background:var(--today-bg)}
  .g-bar{position:absolute;top:5px;bottom:5px;border-radius:5px;display:flex;align-items:center;padding:0 9px;overflow:hidden;cursor:default;transition:filter .15s}
  .g-bar:hover{filter:brightness(.93)}
  .g-bar-label{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .g-bar-tooltip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--text);color:#fff;font-size:11px;padding:5px 9px;border-radius:5px;white-space:nowrap;z-index:999;pointer-events:none}
  .g-bar:hover .g-bar-tooltip{display:block}
  .libre-bar{border:1.5px dashed #a8dbbe !important;background:transparent !important}
  .libre-bar .g-bar-label{color:#2a9d5c !important}
  .legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .leg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:4px 10px}
  .leg-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
  .state-msg{text-align:center;padding:60px 20px;font-size:14px;color:var(--muted)}
  .state-msg .icon{font-size:28px;margin-bottom:12px}
  .error-box{background:#fff5f5;border:1px solid #f5c0c0;border-radius:8px;padding:14px 18px;font-size:13px;color:#a03030;margin-bottom:16px;font-family:'IBM Plex Mono',monospace;white-space:pre-wrap;line-height:1.6}
</style>
</head>
<body>

<div class="page-header">
  <div class="page-title">
    <span class="dot" id="status-dot"></span>
    Planificación técnicos — Obra Nueva
  </div>
  <div class="header-controls">
    <div class="nav-group">
      <button class="btn" onclick="shiftWeeks(-1)">&#8592;</button>
      <span class="nav-label" id="nav-label">—</span>
      <button class="btn" onclick="shiftWeeks(1)">&#8594;</button>
    </div>
    <button class="btn" id="w2" onclick="setWeeks(2)">2 sem</button>
    <button class="btn active" id="w3" onclick="setWeeks(3)">3 sem</button>
    <button class="btn" id="w4" onclick="setWeeks(4)">4 sem</button>
    <button class="btn btn-refresh" onclick="loadData()" id="refresh-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.59"/></svg>
      Actualizar
    </button>
  </div>
</div>

<div class="main">
  <div id="error-box" class="error-box" style="display:none"></div>
  <div class="status-bar"><span id="status-text">Cargando datos...</span></div>
  <div class="gantt-card">
    <div class="gantt-scroll">
      <div class="gantt" id="gantt">
        <div class="state-msg"><div class="icon">⏳</div>Cargando datos desde Google Sheets...</div>
      </div>
    </div>
  </div>
  <div class="legend" id="legend"></div>
</div>

<script>
const PUBLISHED_ID = "2PACX-1vSLM-eLHkLQdtAKcfXmYXndYfJyE98XRw1UG4Z9vKGUMlbmwJ3ld7fbuS0yZSZFy52nEIlZ5Cp4XU_2";

// URL pública CSV — funciona porque la hoja está publicada en web


const PALETTE=[['#c8dff5','#1a4a7a'],['#b8ead8','#0d5c3a'],['#f5d4b8','#7a3810'],['#f0c8d8','#7a1a40'],['#f5e8b0','#7a5800'],['#d8d0f0','#3a2880'],['#f0c8c8','#7a1a1a'],['#c8e8d0','#1a5a30'],['#e8d8c0','#5a3a10'],['#d0e0f0','#1a3a6a'],['#f0e0c8','#6a3a10'],['#d8f0d8','#1a5a1a']];
let colorMap={},colorIdx=0;
function getColor(obra){if(obra.toLowerCase()==='libre')return null;if(!colorMap[obra]){colorMap[obra]=PALETTE[colorIdx%PALETTE.length];colorIdx++;}return colorMap[obra];}

const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
const MESES=['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
let entries=[],viewStart=null,viewWeeks=3;

function parseDate(s){
  if(!s)return null;
  s=s.trim().replace(/^"|"$/g,'');
  const p=s.split(/[\/\-\.]/);
  if(p.length<3)return null;
  let d,m,y;
  if(String(p[2]).length===4){[d,m,y]=p.map(Number);}else{[y,m,d]=p.map(Number);}
  if(!d||!m||!y)return null;
  const dt=new Date(y,m-1,d);dt.setHours(0,0,0,0);return dt;
}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function sameDay(a,b){return a.toDateString()===b.toDateString();}
function daysBetween(a,b){return Math.round((b-a)/864e5);}
function getMonday(d){const r=new Date(d);r.setHours(0,0,0,0);const wd=r.getDay();r.setDate(r.getDate()+(wd===0?-6:1-wd));return r;}
function shiftWeeks(n){viewStart=addDays(viewStart,n*7);render();}
function setWeeks(n){viewWeeks=n;['w2','w3','w4'].forEach(id=>{document.getElementById(id).classList.toggle('active',parseInt(id[1])===n);});render();}

function parseCSV(text){
  // Parsea CSV respetando campos entre comillas
  const rows=[];
  const lines=text.replace(/\r/g,'').split('\n');
  lines.forEach(line=>{
    if(!line.trim())return;
    const cols=[];let cur='',inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){inQ=!inQ;}
      else if(c===','&&!inQ){cols.push(cur.trim());cur='';}
      else{cur+=c;}
    }
    cols.push(cur.trim());
    rows.push(cols);
  });
  return rows;
}

async function loadData(){
  const dot=document.getElementById('status-dot');
  const txt=document.getElementById('status-text');
  const eb=document.getElementById('error-box');
  const rfb=document.getElementById('refresh-btn');
  dot.className='dot loading';txt.textContent='Actualizando...';rfb.disabled=true;eb.style.display='none';

  try{
    const text = await new Promise((resolve, reject) => {
      const cbName = 'cb_' + Date.now();
      const url = `https://docs.google.com/spreadsheets/d/e/${PUBLISHED_ID}/pub?gid=0&single=true&output=csv`;
      // Use fetch with no-cors as last resort — read via iframe trick
      // Actually use the working gviz endpoint with published ID
      const gvizUrl = `https://docs.google.com/spreadsheets/d/e/${PUBLISHED_ID}/gviz/tq?tqx=out:csv&sheet=Datos`;
      const script = document.createElement('script');
      // Fall back to direct iframe-based CSV reading via gviz json
      const jsonUrl = `https://docs.google.com/spreadsheets/d/e/${PUBLISHED_ID}/gviz/tq?tqx=out:json&tq=select%20*&sheet=Datos&callback=${cbName}`;
      window[cbName] = function(data) {
        script.remove();
        delete window[cbName];
        try {
          const rows = data.table.rows;
          const cols = data.table.cols;
          // Build CSV-like text from gviz response
          const header = cols.map(c => '"'+c.label+'"').join(',');
          const lines = [header];
          rows.forEach(row => {
            if(!row.c) return;
            const vals = row.c.map(cell => {
              if(!cell||cell.v===null||cell.v===undefined) return '""';
              return '"'+String(cell.v)+'"';
            });
            lines.push(vals.join(','));
          });
          resolve(lines.join('\n'));
        } catch(e) { reject(e); }
      };
      script.onerror = () => { script.remove(); delete window[cbName]; reject(new Error('No se pudo cargar la hoja')); };
      script.src = jsonUrl;
      document.head.appendChild(script);
      setTimeout(() => { if(window[cbName]){ script.remove(); delete window[cbName]; reject(new Error('Timeout')); } }, 10000);
    });
    if(text.includes('<!DOCTYPE')||text.includes('<html')) throw new Error('La hoja no está publicada correctamente.\nVe a Archivo → Compartir → Publicar en la web → Hoja "Datos" → CSV → Publicar');

    colorMap={};colorIdx=0;entries=[];
    const rows=parseCSV(text);
    if(!rows.length) throw new Error('La hoja está vacía');

    // Detectar si la primera fila es cabecera
    const normalize=s=>(s||'').toLowerCase().replace(/[_\s\u00e9\u00e1\u00ed\u00f3\u00fa]/g,c=>({'\u00e9':'e','\u00e1':'a','\u00ed':'i','\u00f3':'o','\u00fa':'u'}[c]||''));
    const first=rows[0].map(normalize);
    const isHeader=first.some(c=>['tecnico','obra','fecha'].some(k=>c.includes(k)));
    const dataRows=isHeader?rows.slice(1):rows;

    // Detectar índices de columnas por cabecera o posición
    let iN=0,iO=1,iI=2,iF=3;
    if(isHeader){
      rows[0].forEach((c,i)=>{
        const l=normalize(c);
        if(l.includes('tecnico')||l.includes('nombre')) iN=i;
        else if(l.includes('obra')||l.includes('proyecto')) iO=i;
        else if(l.includes('inicio')||l.includes('start')) iI=i;
        else if(l.includes('fin')||l.includes('end')) iF=i;
      });
    }

    dataRows.forEach(cols=>{
      const tecnico=(cols[iN]||'').trim();
      const obra=(cols[iO]||'').trim();
      const f1=(cols[iI]||'').trim();
      const f2=(cols[iF]||'').trim();
      if(!tecnico||!obra)return;
      const start=parseDate(f1),end=parseDate(f2);
      if(!start||!end)return;
      entries.push({tecnico,obra,start,end});
    });

    if(!entries.length) throw new Error('No se encontraron filas válidas.\nFormato esperado: Tecnico | Obra | Fecha_inicio | Fecha_fin\nFechas: DD/MM/AAAA');

    dot.className='dot';
    const now=new Date();
    txt.innerHTML=`<span class="tag">${entries.length} asignaciones</span> <span class="tag">${new Set(entries.map(e=>e.tecnico)).size} técnicos</span> <span class="tag">${new Set(entries.map(e=>e.obra)).size} obras</span> · ${now.toLocaleTimeString('es-ES')}`;
    render();
  }catch(err){
    dot.className='dot error';
    txt.textContent='Error al cargar';
    eb.style.display='block';
    eb.textContent='⚠ '+err.message;
    rfb.disabled=false;
  }
}

function render(){
  if(!entries.length)return;
  const today=new Date();today.setHours(0,0,0,0);
  if(!viewStart)viewStart=getMonday(today);
  const days=[];
  for(let i=0;i<viewWeeks*7;i++)days.push(addDays(viewStart,i));
  const start=days[0],end=days[days.length-1];
  const m1=MESES[start.getMonth()+1],m2=MESES[end.getMonth()+1];
  document.getElementById('nav-label').textContent=m1===m2?`${start.getDate()} – ${end.getDate()} ${m1} ${end.getFullYear()}`:`${start.getDate()} ${m1} – ${end.getDate()} ${m2} ${end.getFullYear()}`;

  const tecOrder=[];
  entries.forEach(e=>{if(!tecOrder.includes(e.tecnico))tecOrder.push(e.tecnico);});
  const cellW=100/days.length;
  const gantt=document.getElementById('gantt');gantt.innerHTML='';

  // Cabecera
  const hdr=document.createElement('div');hdr.className='g-header';
  const nc=document.createElement('div');nc.className='g-name-col';nc.textContent='Técnico';hdr.appendChild(nc);
  const wks=document.createElement('div');wks.className='g-weeks';
  const wkRow=document.createElement('div');wkRow.className='g-week-labels';
  for(let w=0;w<viewWeeks;w++){
    const ws=days[w*7];
    const lbl=document.createElement('div');lbl.className='g-week-lbl';
    lbl.style.flex=String(Math.min(7,days.length-w*7));
    lbl.textContent=`Sem ${w+1} · ${ws.getDate()} ${MESES[ws.getMonth()+1]}`;
    wkRow.appendChild(lbl);
  }
  wks.appendChild(wkRow);
  const dayRow=document.createElement('div');dayRow.className='g-day-labels';
  days.forEach(d=>{
    const wd=d.getDay();
    const cls=['g-day',(wd===0||wd===6)?'weekend':'',sameDay(d,today)?'today':''].filter(Boolean).join(' ');
    const div=document.createElement('div');div.className=cls;
    div.innerHTML=`<span class="dn">${DIAS[wd]}</span><span class="dd">${d.getDate()}</span>`;
    dayRow.appendChild(div);
  });
  wks.appendChild(dayRow);hdr.appendChild(wks);gantt.appendChild(hdr);

  // Filas
  const obrasVistas=new Set();
  tecOrder.forEach(tec=>{
    const tecE=entries.filter(e=>e.tecnico===tec);
    const row=document.createElement('div');row.className='g-row';
    const nameDiv=document.createElement('div');nameDiv.className='g-name';nameDiv.textContent=tec;row.appendChild(nameDiv);
    const track=document.createElement('div');track.className='g-track';
    days.forEach(d=>{
      const wd=d.getDay();
      const cell=document.createElement('div');
      cell.className=['g-cell',(wd===0||wd===6)?'weekend':'',sameDay(d,today)?'today':''].filter(Boolean).join(' ');
      track.appendChild(cell);
    });
    tecE.forEach(e=>{
      const bs=e.start<start?start:e.start;
      const be=e.end>end?end:e.end;
      if(be<start||bs>end)return;
      const off=daysBetween(start,bs);
      const span=daysBetween(bs,be)+1;
      if(span<=0)return;
      const isLibre=e.obra.toLowerCase()==='libre';
      const color=getColor(e.obra);
      obrasVistas.add(e.obra);
      const bar=document.createElement('div');
      bar.className='g-bar'+(isLibre?' libre-bar':'');
      bar.style.left=(off*cellW)+'%';
      bar.style.width=(span*cellW)+'%';
      if(!isLibre&&color)bar.style.background=color[0];
      const label=document.createElement('span');label.className='g-bar-label';
      label.style.color=isLibre?'#2a9d5c':(color?color[1]:'#333');
      label.textContent=e.obra;bar.appendChild(label);
      const tip=document.createElement('span');tip.className='g-bar-tooltip';
      const fmt=dt=>`${dt.getDate()}/${dt.getMonth()+1}/${dt.getFullYear()}`;
      tip.textContent=`${tec} · ${e.obra} · ${fmt(e.start)} – ${fmt(e.end)}`;
      bar.appendChild(tip);track.appendChild(bar);
    });
    row.appendChild(track);gantt.appendChild(row);
  });

  // Leyenda
  const legend=document.getElementById('legend');legend.innerHTML='';
  [...obrasVistas].forEach(obra=>{
    const item=document.createElement('div');item.className='leg';
    if(obra.toLowerCase()==='libre'){
      item.innerHTML=`<span class="leg-dot" style="background:transparent;border:1.5px dashed #2a9d5c"></span>${obra}`;
    }else{
      const c=getColor(obra);if(!c)return;
      item.innerHTML=`<span class="leg-dot" style="background:${c[0]};border:1px solid ${c[1]}40"></span>${obra}`;
    }
    legend.appendChild(item);
  });
}

viewStart=getMonday(new Date());
loadData();
</script>
</body>
</html>
